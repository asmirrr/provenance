[project]
name = "provenance"
version = "0.1.0"
description = "Traceable financial document ingestion for evidence-grounded research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
